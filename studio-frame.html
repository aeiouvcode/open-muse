<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; font-src 'none'; base-uri 'none'; form-action 'none'">
<title>Muse app frame</title></head>
<body>
<script>
// Isolation shell for user mini-apps. Runs sandboxed (opaque origin, no storage),
// no network by its own CSP. Receives the app code from Open Muse and writes it.
window.addEventListener("message", function(e){
  if(!e.data || typeof e.data.openmuseApp !== "string") return;
  document.open(); document.write(e.data.openmuseApp); document.close();
});
</script>
</body></html>
